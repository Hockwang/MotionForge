name: CI

# 触发条件：
#   - 推到任何分支（含 main 和 feature/*）
#   - PR 到 main（防止没有测试的改动被 merge）
on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test + Build
    runs-on: ubuntu-latest
    # 并发保护：同一分支后续 push 取消前一次跑（节省 CI 额度）
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # vitest 跑全部 unit + integration（见 vitest.config.js）
        run: npm test

      - name: Build
        # 验证 Vite 能完整编译，顺便确认 lazy-import 的独立 chunks 没破
        run: npm run build
